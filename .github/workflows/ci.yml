name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    uses: ./.github/workflows/reuse.yml

  commit_conventions:
    uses: ./.github/workflows/commit-conventions.yml

  build:
    name: Build / linux-${{ matrix.arch }}
    needs: [reuse, commit_conventions]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile and export UDM
        env:
          TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker buildx build \
          --platform "$TARGET_PLATFORM" \
          --file tests/containers/Containerfile \
          --output type=local,dest=artifacts \
          .

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: udm-linux-${{ matrix.arch }}
          path: artifacts/udm
          if-no-files-found: 'error'
          retention-days: 7

  test:
    name: Test / ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cachyos-hyprland-amd64
            arch: amd64
            runner: ubuntu-24.04
            context: tests/containers/cachyos/wayland/hyprland
          - name: debian-hyperland-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            context: tests/containers/debian/wayland/hyprland

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: udm-linux-${{ matrix.arch }}
          path: artifacts

      - name: Test target
        uses: ./.github/actions/test-container
        with:
          context: ${{ matrix.context }}
          platform: linux/${{ matrix.arch }}