name: Commit conventions

on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    name: Commit conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Install commitlint
        run: npm ci --prefix .github/tools/commitlint

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" |
            npm --prefix .github/tools/commitlint run lint

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$BEFORE"
          
          npm --prefix .github/tools/commitlint run lint -- \
            --from "$BEFORE" \
            --to "$AFTER"

      - name: Validate latest commit on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm --prefix .github/tools/commitlint run lint -- --last