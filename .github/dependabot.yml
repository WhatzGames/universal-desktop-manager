version: 2
updates:
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/.github/tools/commitlint"
    schedule:
      interval: weekly